services:
  jenkins:
    build: .
    image: visionassist-jenkins:1.0
    container_name: jenkins
    user: root
    restart: unless-stopped
    ports:
      - "8081:8080"   # Jenkins UI (8080 is already used by the VisionAssist container)
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  jenkins_home:
